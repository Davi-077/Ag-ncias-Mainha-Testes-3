<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagamento | Agência Mainha</title>
<link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<header><nav>
<a href="index.html">Início</a>
<a href="pacotes.html">Pacotes</a>
<a href="clube.html">Mainha Club</a>
<a href="quem-somos.html">Quem Somos</a>
</nav></header>

<main class="container">
<h1>Pagamento</h1>
<div class="checkout-grid">

<section class="section">
<h2>Dados da compra</h2>

<label>Nome do cliente
<input id="cliente" placeholder="Digite seu nome">
</label>

<label>Valor do pacote (provisório)
<input id="preco" type="number" value="0" min="0">
</label>

<label>Forma de pagamento
<select id="pagamento">
<option value="pix">Pix — 10% de desconto</option>
<option value="avista">Cartão à vista — 5% de desconto</option>
<option value="parcelado">Cartão parcelado — 10x</option>
</select>
</label>
</section>

<section class="section resumo">
<h2>Resumo</h2>
<p>Valor original: <strong id="original">R$ 0,00</strong></p>
<p>Desconto: <strong id="desconto">R$ 0,00</strong></p>
<p>Cashback disponível: <strong id="cashback">R$ 0,00</strong></p>
<p class="total">Total: <strong id="total">R$ 0,00</strong></p>
<p id="parcelas"></p>
</section>

</div>
</main>

<script>
const clientes = {
  "Rafael Fama": {categoria:"Mainha", cashback:600},
  "Richard": {categoria:"Mainha", cashback:600},
  "Pedrinho": {categoria:"Prata", cashback:400},
  "Pietro Noal": {categoria:"Prata", cashback:400},
  "Victor Lerry": {categoria:"Bronze", cashback:150},
  "Miguel Tolentino": {categoria:"Bronze", cashback:150}
};

const cliente = document.getElementById("cliente");
const preco = document.getElementById("preco");
const pagamento = document.getElementById("pagamento");

function moeda(v) {
  return v.toLocaleString("pt-BR", {
    style:"currency",
    currency:"BRL"
  });
}

function atualizar() {
  const valor = Number(preco.value) || 0;
  const forma = pagamento.value;

  let percentual = 0;
  if (forma === "pix") percentual = 0.10;
  if (forma === "avista") percentual = 0.05;

  const desconto = valor * percentual;
  const info = clientes[cliente.value.trim()];
  const cashback = info ? info.cashback : 0;
  const total = valor - desconto;

  document.getElementById("original").textContent = moeda(valor);
  document.getElementById("desconto").textContent = moeda(desconto);
  document.getElementById("cashback").textContent = moeda(cashback);
  document.getElementById("total").textContent = moeda(total);

  document.getElementById("parcelas").textContent =
    forma === "parcelado"
      ? "10x de " + moeda(total / 10)
      : "";
}

[cliente, preco, pagamento].forEach(el => {
  el.addEventListener("input", atualizar);
});

atualizar();
</script>
</body>
</html>
