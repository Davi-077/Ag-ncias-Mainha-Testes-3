<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento | Agência Mainha</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
<header>
  <nav>
    <a href="index.html">Início</a>
    <a href="pacotes.html">Pacotes</a>
    <a href="clube.html">Mainha Club</a>
    <a href="quem-somos.html">Quem Somos</a>
  </nav>
</header>

<main class="container">
  <h1>Pagamento</h1>

  <div class="checkout-grid">

    <section class="section">
      <h2>Dados da compra</h2>

      <label>
        Nome do cliente
        <input id="cliente" type="text" placeholder="Digite seu nome" autocomplete="off">
      </label>

      <div id="cliente-status" class="checkout-message"></div>

      <label>
        Valor do pacote
        <input id="preco" type="number" value="4500" min="0" step="0.01">
      </label>

      <label>
        Forma de pagamento
        <select id="pagamento">
          <option value="pix">Pix — 10% de desconto</option>
          <option value="avista">Cartão à vista — 5% de desconto</option>
          <option value="parcelado">Cartão parcelado — 10x</option>
        </select>
      </label>

      <div class="cashback-use">
        <h3>Usar cashback</h3>

        <p>
          Cashback disponível:
          <strong id="cashback-disponivel">R$ 0,00</strong>
        </p>

        <label>
          Quanto de cashback deseja utilizar?
          <input
            id="cashback-usar"
            type="number"
            value="0"
            min="0"
            step="0.01"
            placeholder="0,00"
          >
        </label>

        <div id="cashback-mensagem" class="checkout-message"></div>
      </div>
    </section>

    <section class="section resumo">
      <h2>Resumo</h2>

      <p>Valor original: <strong id="original">R$ 0,00</strong></p>
      <p>Desconto da forma de pagamento: <strong id="desconto">R$ 0,00</strong></p>
      <p>Valor após desconto: <strong id="subtotal">R$ 0,00</strong></p>
      <p>Cashback utilizado: <strong id="cashback-utilizado">R$ 0,00</strong></p>
      <p>Cashback restante: <strong id="cashback-restante">R$ 0,00</strong></p>

      <p class="total">
        Total a pagar:
        <strong id="total">R$ 0,00</strong>
      </p>

      <p id="parcelas"></p>
    </section>

  </div>
</main>

<script>
/*
  CLIENTES E CASHBACK
  Mainha = R$ 1.500
  Prata  = R$ 900
  Bronze = R$ 500

  Clientes já definidos:
  Rafael Fama   -> Mainha
  Richard       -> Mainha
  Pedrinho      -> Prata
  Pietro Noal   -> Prata
  Victor Lerry  -> Bronze
  Miguel Tolentino -> Bronze
*/

const clientes = {
  "Rafael Fama": {
    categoria: "Mainha",
    cashback: 1500
  },
  "Richard": {
    categoria: "Mainha",
    cashback: 1500
  },
  "Pedrinho": {
    categoria: "Prata",
    cashback: 900
  },
  "Pietro Noal": {
    categoria: "Prata",
    cashback: 900
  },
  "Victor Lerry": {
    categoria: "Bronze",
    cashback: 500
  },
  "Miguel Tolentino": {
    categoria: "Bronze",
    cashback: 500
  }
};

const clienteInput = document.getElementById("cliente");
const precoInput = document.getElementById("preco");
const pagamentoInput = document.getElementById("pagamento");
const cashbackUsarInput = document.getElementById("cashback-usar");

function moeda(valor) {
  return Number(valor).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function encontrarCliente(nomeDigitado) {
  const nome = nomeDigitado.trim();

  if (!nome) return null;

  if (clientes[nome]) return clientes[nome];

  const nomeEncontrado = Object.keys(clientes).find(
    nomeCadastrado =>
      nomeCadastrado.toLowerCase() === nome.toLowerCase()
  );

  return nomeEncontrado ? clientes[nomeEncontrado] : null;
}

function atualizarPagamento() {
  const valorOriginal = Math.max(Number(precoInput.value) || 0, 0);
  const forma = pagamentoInput.value;

  let percentualDesconto = 0;

  if (forma === "pix") percentualDesconto = 0.10;
  if (forma === "avista") percentualDesconto = 0.05;

  const desconto = valorOriginal * percentualDesconto;
  const subtotal = Math.max(valorOriginal - desconto, 0);

  const cliente = encontrarCliente(clienteInput.value);
  const cashbackDisponivel = cliente ? cliente.cashback : 0;

  const solicitado = Math.max(
    Number(cashbackUsarInput.value) || 0,
    0
  );

  const maximoPermitido = Math.min(
    cashbackDisponivel,
    subtotal
  );

  const valorValido = solicitado <= maximoPermitido;

  const cashbackUtilizado = valorValido ? solicitado : 0;
  const cashbackRestante =
    cashbackDisponivel - cashbackUtilizado;

  const total =
    Math.max(subtotal - cashbackUtilizado, 0);

  document.getElementById("original").textContent =
    moeda(valorOriginal);

  document.getElementById("desconto").textContent =
    moeda(desconto);

  document.getElementById("subtotal").textContent =
    moeda(subtotal);

  document.getElementById("cashback-disponivel").textContent =
    moeda(cashbackDisponivel);

  document.getElementById("cashback-utilizado").textContent =
    moeda(cashbackUtilizado);

  document.getElementById("cashback-restante").textContent =
    moeda(cashbackRestante);

  document.getElementById("total").textContent =
    moeda(total);

  const status = document.getElementById("cliente-status");
  const mensagem = document.getElementById("cashback-mensagem");

  if (!clienteInput.value.trim()) {
    status.textContent = "";
    mensagem.textContent =
      "Digite o nome do cliente para consultar o cashback.";
    mensagem.className = "checkout-message";
  }
  else if (!cliente) {
    status.textContent =
      "Cliente não encontrado no Mainha Club.";
    status.className = "checkout-message error";

    mensagem.textContent =
      "Este cliente não está cadastrado.";
    mensagem.className = "checkout-message error";
  }
  else {
    status.textContent =
      "Cliente: " + clienteInput.value.trim() +
      " · Categoria: " + cliente.categoria;

    status.className = "checkout-message success";

    if (solicitado > cashbackDisponivel) {
      mensagem.textContent =
        "Você possui apenas " +
        moeda(cashbackDisponivel) +
        " de cashback disponível.";
      mensagem.className = "checkout-message error";
    }
    else if (solicitado > subtotal) {
      mensagem.textContent =
        "O cashback não pode ser maior que o valor restante da compra.";
      mensagem.className = "checkout-message error";
    }
    else if (solicitado > 0) {
      mensagem.textContent =
        "Cashback aplicado: " +
        moeda(cashbackUtilizado) + ".";
      mensagem.className = "checkout-message success";
    }
    else {
      mensagem.textContent =
        "Digite quanto deseja utilizar do seu cashback.";
      mensagem.className = "checkout-message";
    }
  }

  if (forma === "parcelado") {
    document.getElementById("parcelas").textContent =
      "10x de " + moeda(total / 10);
  }
  else {
    document.getElementById("parcelas").textContent = "";
  }
}

[
  clienteInput,
  precoInput,
  pagamentoInput,
  cashbackUsarInput
].forEach(elemento => {
  elemento.addEventListener("input", atualizarPagamento);
  elemento.addEventListener("change", atualizarPagamento);
});

atualizarPagamento();
</script>

</body>
</html>
